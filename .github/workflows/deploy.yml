name: Deploy to Vultr

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Pull, build and deploy on server
        uses: appleboy/ssh-action@v1.2.1
        with:
          host: ${{ secrets.VULTR_HOST }}
          username: root
          key: ${{ secrets.VULTR_SSH_KEY }}
          script: |
            set -e
            REPO=/var/www/admill.co.zw/admill.co.zw
            PROJECT=$REPO/admill-landing-page
            SITE=/var/www/admill.co.zw/public

            echo "==> Pulling latest code (autostash preserves local robots.txt tweak)"
            git -C $REPO pull --autostash --ff-only origin main

            echo "==> Installing dependencies"
            cd $PROJECT
            npm install --no-audit --no-fund

            echo "==> Building static site"
            NODE_OPTIONS=--max-old-space-size=1024 npm run build

            echo "==> Syncing out/ to nginx root (matomo preserved)"
            rsync -a --exclude='matomo' $PROJECT/out/ $SITE/

            echo "==> Reloading nginx"
            systemctl reload nginx

            echo "✅ Deployment complete"