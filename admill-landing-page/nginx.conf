# Nginx Configuration for Admill Systems Website
# Place this file at: /etc/nginx/sites-available/admill.co.zw

server {
    listen 80;
    listen [::]:80;
    server_name admill.co.zw www.admill.co.zw;

    # Redirect all HTTP traffic to HTTPS (uncomment after SSL setup)
    # return 301 https://$server_name$request_uri;

    # Root directory (for static files if needed)
    root /var/www/admill-landing-page/public;

    # Logging
    access_log /var/log/nginx/admill_access.log;
    error_log /var/log/nginx/admill_error.log;

    # Proxy to Next.js server running on localhost:3000
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;

        # WebSocket support (for Next.js HMR and similar features)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # Forward headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering for real-time features
        proxy_cache_bypass $http_upgrade;
        proxy_buffering off;

        # Timeout settings
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Handle Next.js static files efficiently
    location /_next/static/ {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        # Cache static assets for 1 year
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Serve public assets directly (optional optimization)
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot|mp4|webp)$ {
        try_files $uri @nextjs;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Fallback to Next.js for assets not found
    location @nextjs {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/rss+xml
        application/atom+xml
        image/svg+xml
        text/x-component
        text/x-cross-domain-policy;

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # robots.txt and sitemap (served by Next.js)
    location = /robots.txt {
        proxy_pass http://localhost:3000;
        log_not_found off;
    }

    location = /sitemap.xml {
        proxy_pass http://localhost:3000;
        log_not_found off;
    }
}

